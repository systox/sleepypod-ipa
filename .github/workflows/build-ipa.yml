name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: sleepypod/ios tag or branch to build
        required: true
        default: v1.3.1

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SOURCE_REF: ${{ inputs.ref }}
    steps:
      - name: Get the app source
        uses: actions/checkout@v4
        with:
          repository: sleepypod/ios
          ref: ${{ inputs.ref }}
          path: source
          lfs: true

      - name: Build without signing
        working-directory: source
        run: >
          xcodebuild build
          -project Sleepypod.xcodeproj
          -scheme Sleepypod
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/derived"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          -quiet

      - name: Package the IPA
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Sleepypod.app"
          test -d "$app"
          safe_ref=$(printf '%s' "$SOURCE_REF" | tr '/' '-')
          ipa="Sleepypod-$safe_ref-unsigned.ipa"
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry "$ipa" Payload
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          echo "SAFE_REF=$safe_ref" >> "$GITHUB_ENV"

      - name: Publish the IPA as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$SAFE_REF-build-$GITHUB_RUN_NUMBER" "$IPA"
          --repo "$GITHUB_REPOSITORY"
          --title "Sleepypod $SOURCE_REF unsigned build $GITHUB_RUN_NUMBER"
          --notes "Unsigned build of https://github.com/sleepypod/ios at $SOURCE_REF. Source and AGPL-3.0 license are in that repository."
